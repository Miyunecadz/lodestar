name: ci

# Gates merges into the default branch. Set this as a required status check in the
# branch ruleset (see .github/rulesets/protect-main.json).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Discovered, not listed. The hand-maintained list had drifted: it missed
      # kit/templates/hooks/lodestar-graph-refresh.sh — the one shell script installed
      # into users' git-hook managers, which runs on every commit and `git add`s into it.
      # The highest-reach script in the repo was the only one not linted.
      - name: Shellcheck every shell script
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck --severity=error

      - name: Validate catalog + version consistency
        run: python3 .github/scripts/validate.py

      - name: Hook parity (duplicated frontmatter helpers agree)
        run: python3 .github/scripts/test-hook-parity.py

      - name: Smoke-test the guardrail engine
        run: bash .github/scripts/test-engine.sh

      - name: Smoke-test the installer
        run: bash .github/scripts/test-install.sh

      - name: Smoke-test the commit-surface guardrails
        run: bash .github/scripts/test-precommit.sh

      - name: Smoke-test graph coverage
        run: bash .github/scripts/test-coverage.sh

      - name: Smoke-test graph freshness
        run: bash .github/scripts/test-freshness.sh

      - name: Smoke-test the graph-refresh pre-commit hook
        run: bash .github/scripts/test-graph-refresh.sh

      - name: Smoke-test the permission surface
        run: bash .github/scripts/test-permissions.sh

  # The enforcement hooks ship to machines whose `python3` is not this runner's. A
  # version-floor break does not fail loudly — it makes every guardrail silently inert
  # (issue #29) — so the two suites that assert enforcement run against the declared
  # floor as well as the current release. MIN_PYTHON in both hooks is the source of
  # truth; changing it means changing the matrix below.
  #
  # Pinned to 22.04: actions/setup-python has no 3.8 build for ubuntu-24.04.
  python-floor:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.x"]
    name: python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke-test the guardrail engine
        env:
          LODESTAR_TEST_PYTHON: ${{ steps.setup.outputs.python-path }}
        run: bash .github/scripts/test-engine.sh

      - name: Smoke-test the commit-surface guardrails
        env:
          LODESTAR_TEST_PYTHON: ${{ steps.setup.outputs.python-path }}
        run: bash .github/scripts/test-precommit.sh
